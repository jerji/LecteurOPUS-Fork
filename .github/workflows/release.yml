name: Build release APK

on:
  push:
    tags:
      - 'v*'
      - '*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > app/ci_keystore.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Create release and upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_name="LecteurOPUS-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release exists, uploading APK"
            gh release upload "${{ github.ref_name }}" "$apk_name" --clobber
            gh release edit "${{ github.ref_name }}" --draft=false --latest
          else
            echo "Creating release"
            gh release create "${{ github.ref_name }}" \
              --title "v${{ github.ref_name }}" \
              --notes "Automated release from tag ${{ github.ref_name }}." \
              --latest \
              "$apk_name"
          fi