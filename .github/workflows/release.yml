name: Build release APK

on:
  push:
    tags:
      - 'v*'
      - '*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > app/ci_keystore.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK to release
        uses: actions/upload-artifact@v4
        with:
          name: LecteurOPUS-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error